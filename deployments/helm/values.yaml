# Default operational values for rag-chunk-lifecycle-service.

replicaCount: 3

image:
  repository: ghcr.io/gemejime/rag-chunk-lifecycle-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  grpcPort: 50051
  httpPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chunk-lifecycle.internal
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  chunkServer:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1.5Gi
  reconciliationWorker:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - rag-chunk-lifecycle-service
          topologyKey: topology.kubernetes.io/zone

nodeSelector: {}
tolerations: []

env:
  ENVIRONMENT: "production"
  GRPC_PORT: "50051"
  HTTP_PORT: "8080"
  LOG_LEVEL: "info"
  REDIS_ADDR: "redis-cluster.cache.svc.cluster.local:6379"

config:
  # Injected via external secret; ensure connection string enforces TLS with sslmode=require
  databaseUrl: "postgres://chunk_user:REPLACE_WITH_PRODUCTION_PASSWORD@pgbouncer.database.svc.cluster.local:6432/chunk_lifecycle?sslmode=require"
  redisAddr: "redis-cluster.cache.svc.cluster.local:6379"

secrets:
  databasePassword: ""
  redisPassword: ""
  REDIS_URL: ""

# Canary progressive delivery configuration
canary:
  enabled: false
  removeDeployment: false
  analysis:
    enabled: true
  trafficRouting: {}

# Prometheus alerting rule configuration
prometheusRule:
  enabled: true
  additionalLabels:
    role: alert-rules
