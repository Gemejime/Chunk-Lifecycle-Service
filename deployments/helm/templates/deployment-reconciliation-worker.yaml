apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-reconciliation-worker
  labels:
    {{- include "rag-chunk-lifecycle-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciliation-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "rag-chunk-lifecycle-service.reconciliationWorkerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rag-chunk-lifecycle-service.reconciliationWorkerSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rag-chunk-lifecycle-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: reconciliation-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "/usr/local/bin/reconciliation-worker"
          args:
            - "--task=run-reconciler"
          envFrom:
            - configMapRef:
                name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-config
            - secretRef:
                name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-secret
          livenessProbe:
            exec:
              command:
                - "/usr/local/bin/reconciliation-worker"
                - "--task=healthcheck"
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - "/usr/local/bin/reconciliation-worker"
                - "--task=healthcheck"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources.reconciliationWorker | nindent 12 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
