apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-chunk-server
  labels:
    {{- include "rag-chunk-lifecycle-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: chunk-server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc-flight
      protocol: TCP
      name: grpc-flight
    - port: {{ .Values.service.httpPort }}
      targetPort: http-rest
      protocol: TCP
      name: http-rest
  selector:
    {{- include "rag-chunk-lifecycle-service.chunkServerSelectorLabels" . | nindent 4 }}
