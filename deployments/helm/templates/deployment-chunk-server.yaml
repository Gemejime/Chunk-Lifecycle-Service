{{- if not .Values.canary.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-chunk-server
  labels:
    {{- include "rag-chunk-lifecycle-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: chunk-server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rag-chunk-lifecycle-service.chunkServerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rag-chunk-lifecycle-service.chunkServerSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rag-chunk-lifecycle-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: chunk-server
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc-flight
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: http-rest
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-config
            - secretRef:
                name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-rest
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-rest
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources.chunkServer | nindent 12 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
