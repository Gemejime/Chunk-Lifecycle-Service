apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-config
  labels:
    {{- include "rag-chunk-lifecycle-service.labels" . | nindent 4 }}
data:
  HTTP_PORT: {{ .Values.env.httpPort | quote }}
  GRPC_PORT: {{ .Values.env.grpcPort | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  REDIS_ADDR: {{ .Values.config.redisAddr | quote }}
