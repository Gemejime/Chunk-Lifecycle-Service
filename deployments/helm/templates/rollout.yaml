{{- if .Values.canary.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-chunk-server
  labels:
    {{- include "rag-chunk-lifecycle-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: chunk-server
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "rag-chunk-lifecycle-service.chunkServerSelectorLabels" . | nindent 6 }}
  strategy:
    canary:
      stableService: {{ include "rag-chunk-lifecycle-service.fullname" . }}-chunk-server-stable
      canaryService: {{ include "rag-chunk-lifecycle-service.fullname" . }}-chunk-server-canary
      analysis:
        templates:
          - templateName: chunk-server-canary-analysis
        args:
          - name: service-name
            value: {{ include "rag-chunk-lifecycle-service.fullname" . }}-chunk-server
      steps:
        # Step 1: 10% canary traffic with verification pause
        - setWeight: 10
        - pause: { duration: 2m }
        # Step 2: 25% canary traffic with verification pause
        - setWeight: 25
        - pause: { duration: 5m }
        # Step 3: Full 100% rollout upon passing metric criteria
        - setWeight: 100
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rag-chunk-lifecycle-service.chunkServerSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rag-chunk-lifecycle-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: chunk-server
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc-flight
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: http-rest
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-config
            - secretRef:
                name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-rest
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-rest
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources.chunkServer | nindent 12 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

