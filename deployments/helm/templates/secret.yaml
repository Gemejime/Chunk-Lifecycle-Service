apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-chunk-lifecycle-service.fullname" . }}-secret
  labels:
    {{- include "rag-chunk-lifecycle-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ default .Values.config.databaseUrl (get .Values.secrets "databaseUrl") | quote }}
  {{- if or .Values.secrets.redisPassword (get .Values.secrets "REDIS_PASSWORD") }}
  REDIS_PASSWORD: {{ default .Values.secrets.redisPassword (get .Values.secrets "REDIS_PASSWORD") | quote }}
  {{- end }}
  {{- if or .Values.config.redisUrl (get .Values.secrets "REDIS_URL") }}
  REDIS_URL: {{ default .Values.config.redisUrl (get .Values.secrets "REDIS_URL") | quote }}
  {{- end }}
