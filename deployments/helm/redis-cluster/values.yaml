## ==============================================================================
## Bitnami Redis Cluster Helm Configuration
## Microservice: rag-chunk-lifecycle-service
## Namespace: rag-chunk-lifecycle
## Chart Target: bitnami/redis-cluster (Redis 7.2+)
## ==============================================================================

global:
  redis:
    existingSecret: "rag-chunk-lifecycle-service-secret"
    existingSecretPasswordKey: "REDIS_PASSWORD"

## Image configuration: Bitnami Redis 7.2
image:
  registry: docker.io
  repository: bitnami/redis-cluster
  tag: "7.2.5-debian-12-r0"
  pullPolicy: IfNotPresent

## Clustered Topology: 6 nodes (3 Primary shards + 3 Secondary replicas)
cluster:
  init: true
  nodes: 6
  replicas: 1
  defaultStoreState: true

## Redis runtime parameters and persistence engine
redis:
  port: 6379
  busPort: 16379
  clusterPort: 6379
  configuration: |
    appendonly yes
    appendfsync everysec
    maxmemory 800mb
    maxmemory-policy noeviction
    cluster-node-timeout 15000
    cluster-require-full-coverage no
    slowlog-log-slower-than 10000
    slowlog-max-len 128

## Direct Authentication Binding to existing Microservice Secret
usePassword: true
existingSecret: "rag-chunk-lifecycle-service-secret"
existingSecretPasswordKey: "REDIS_PASSWORD"

## Container Resource Bounds
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

## Dedicated Persistent Volumes (5Gi per cluster node)
persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce

## High-Availability Soft Pod Anti-Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: redis-cluster
          topologyKey: kubernetes.io/hostname
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: redis-cluster
          topologyKey: topology.kubernetes.io/zone

## Pod & Container Security Posture
securityContext:
  enabled: true
  fsGroup: 1001

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## Prometheus Metrics Exporter (Port 9121)
metrics:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/redis-exporter
    tag: "1.67.0-debian-12-r4"
    pullPolicy: IfNotPresent
  containerPort: 9121
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
    prometheus.io/path: "/metrics"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9121"
      prometheus.io/path: "/metrics"
  serviceMonitor:
    enabled: false
