name: CI Pipeline

on:
  push:
    branches: [ "main", "rag-chunk-lifecycle-service" ]
  pull_request:
    branches: [ "main", "rag-chunk-lifecycle-service" ]

permissions:
  contents: read

jobs:
  lint-and-spec:
    name: Lint & Spec Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Buf Lint
        run: buf lint

      - name: Verify Formatting (goimports)
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          test -z "$(goimports -l .)" || (echo "Unformatted Go files detected:" && goimports -d . && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pyyaml

      - name: Verify Environment Sync (Zero Drift)
        run: python scripts/sync_env_to_deployments.py --check-only

      - name: Run Python Sync Unit Tests
        run: python test/test_sync_env_to_deployments.py

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

  test:
    name: Test Suite with Race Detection
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_chunk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run Unit Tests
        run: go test -v -race ./test/unit/...

      - name: Run Performance Benchmarks
        run: go test -v -tags=performance ./test/performance/...

      - name: Run Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  helm-and-k8s:
    name: Helm & Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint deployments/helm

      - name: Template Validate Helm Chart
        run: helm template test deployments/helm

  docker-build:
    name: Zero-Trust Distroless Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          tags: rag-chunk-lifecycle-service:latest
