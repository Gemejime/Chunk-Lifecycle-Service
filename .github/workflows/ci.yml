name: rag-chunk-lifecycle-service CI/CD

on:
  push:
    branches: [ main, master, "release/**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  proto-lint:
    name: Protobuf Lint & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Protobuf
        run: |
          if [ -f "buf.yaml" ]; then
            buf lint
          else
            echo "No buf.yaml configured yet; skipping buf lint."
          fi

  lint:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: true

      - name: Verify Go Module Tidiness
        run: |
          if [ -f "go.mod" ]; then
            go mod tidy
            git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)
          else
            echo "go.mod not yet created; skipping mod tidy check."
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        if: hashFiles('go.mod') != ''
        with:
          version: v1.61.0
          args: --timeout=5m

  test-unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Unit Tests
        run: |
          if [ -f "go.mod" ]; then
            go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
          else
            echo "go.mod not yet created; skipping unit tests."
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: hashFiles('coverage.out') != ''
        with:
          name: unit-test-coverage
          path: coverage.out
          retention-days: 7

  test-integration:
    name: Integration Tests (PostgreSQL 16 & Redis 7.2)
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chunk_user
          POSTGRES_PASSWORD: chunk_password
          POSTGRES_DB: chunk_lifecycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URL: postgres://chunk_user:chunk_password@localhost:5432/chunk_lifecycle_test?sslmode=disable
      TEST_REDIS_URL: localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Integration Tests
        run: |
          if [ -d "test/integration" ] && [ -f "go.mod" ]; then
            go test -v -race -tags=integration ./test/integration/...
          else
            echo "Integration tests or go.mod not yet present; skipping integration suite."
          fi

  vulnerability-scan:
    name: Go Security Audit (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run govulncheck
        run: |
          if [ -f "go.mod" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck ./...
          else
            echo "go.mod not yet created; skipping govulncheck."
          fi

  docker-build:
    name: Docker Build Validation (Distroless)
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Chunk Server Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile
          target: chunk-server
          push: false
          tags: rag-chunk-lifecycle-service/chunk-server:test
        continue-on-error: true # Continues if Dockerfile has not been authored yet

      - name: Validate Reconciliation Worker Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile
          target: reconciliation-worker
          push: false
          tags: rag-chunk-lifecycle-service/reconciliation-worker:test
        continue-on-error: true # Continues if Dockerfile has not been authored yet
